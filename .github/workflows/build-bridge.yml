# Builds machine-bridge.exe on a real Windows runner.
#
# This exists because a Windows .exe cannot be cross-compiled from Linux --
# PyInstaller freezes the interpreter it is running under, so a Windows binary
# needs a Windows machine. GitHub's windows-latest runner is that machine, and
# it is free for public repositories.
#
# Run it from the Actions tab, then download the artifact.

name: build machine-bridge.exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller==6.11.1

      - name: Build
        run: >
          pyinstaller
          --onefile
          --console
          --name machine-bridge
          --hidden-import machine_mcp
          --paths tools/bridge
          tools/bridge/bridge_app.py

      - name: Smoke test the binary
        shell: pwsh
        run: |
          # A build that produces an exe which cannot start is a failed build.
          # --selftest takes the non-interactive path: no folder dialog, no
          # config written, no port bound, and it exits on its own. The first
          # attempt started the exe normally, which blocked on the first-run
          # dialog and -- because Python block-buffers a redirected stdout --
          # produced an empty log that looked like a binary that never ran.
          dist\machine-bridge.exe --selftest | Tee-Object -FilePath out.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "selftest exited $LASTEXITCODE"
            exit 1
          }
          foreach ($needle in 'machine-bridge self-test', 'search_files', 'READ ONLY', 'OK') {
            if (-not (Select-String -Path out.txt -Pattern $needle -SimpleMatch -Quiet)) {
              Write-Error "selftest output missing: $needle"
              exit 1
            }
          }
          Write-Host 'binary runs and reports the expected toolset'

      - uses: actions/upload-artifact@v4
        with:
          name: machine-bridge-exe
          path: dist/machine-bridge.exe
          retention-days: 30
